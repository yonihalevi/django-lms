apiVersion: apps/v1
kind: Deployment
metadata:
  name: django
spec:
  replicas: 1
  selector:
    matchLabels:
      app: django
  template:
    metadata:
      labels:
        app: django
    spec:
      containers:
        - name: django
          image: django-lms:local
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: django-config
            - secretRef:
                name: django-secret
          ports:
            - containerPort: 8000
          command: ["sh", "-c"]
          args:
            - |
              python manage.py migrate &&
              python manage.py collectstatic --noinput &&
              python manage.py runserver 0.0.0.0:8000
---
apiVersion: v1
kind: Service
metadata:
  name: django
spec:
  selector:
    app: django
  ports:
    - port: 8000
      targetPort: 8000
